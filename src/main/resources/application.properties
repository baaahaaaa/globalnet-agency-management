spring.application.name=gestion-gnet
server.port=${PORT:8081}

# MySQL by default; demo/test profiles use an in-memory H2 database.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/globalnet}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Required: 32+ UTF-8 bytes. Never commit a production JWT secret.
app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:4200}
